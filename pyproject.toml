[project]
name = "txsa-assignment"
version = "0.1.0"
description = "Text Analytics and Sentiment Analysis assignment code."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "en-core-web-sm",
    "matplotlib>=3.10.0",
    "nltk>=3.9.2",
    "pandas>=3.0.0",
    "spacy>=3.8.14",
    "stanza>=1.11.1",
    "textblob>=0.19.0",
    "transformers>=4.57.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
txsa-q1 = "txsa_assignment.question_1:main"
txsa-q2 = "txsa_assignment.question_2:main"
txsa-q3 = "txsa_assignment.question_3:main"
txsa-q4 = "txsa_assignment.question_4:main"
txsa-q5 = "txsa_assignment.question_5:main"

[build-system]
requires = ["uv_build>=0.11.8,<0.12.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.uv.sources]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }
